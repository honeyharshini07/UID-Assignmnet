<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalMart</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="assets/img/logo.png" alt="Logo" style="height:40px;margin-right:8px;border-radius:4px;">WalMart</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
          </ul>
        </div>
        <div class="d-flex align-items-center ml-3">
          <a href="cart.html" class="cart-icon ml-2"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cart-count">0</span></a>
        </div>
      </div>
    </nav>
  </header>

  <section class="page-header">
    <div class="page-header-bg">
      <div id="pageCarousel" class="carousel slide carousel-fade" data-ride="carousel" data-interval="3000">
        <div class="carousel-inner">
          <div class="carousel-item active"><img src="assets/img/background1.png" alt="Background"></div>
          <div class="carousel-item"><img src="assets/img/background2.png" alt="Background"></div>
          <div class="carousel-item"><img src="assets/img/background3.png" alt="Background"></div>
          <div class="carousel-item"><img src="assets/img/background4.png" alt="Background"></div>
        </div>
        <a class="carousel-control-prev" href="#pageCarousel" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#pageCarousel" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
    </div>
    <div class="container">
      <h1>Feedback</h1>
      <p>WalMart - We are happy to take your feedback!</p>
    </div>
  </section>

  <section class="contact-section">
    <div class="container">
      <div class="row">
        <div class="col-lg-7">
          <div class="contact-form">
            <h3>Give your Feedback</h3>
            <form class="newsletter-form" onsubmit="event.preventDefault(); showNotification('Thank you for your feedback!'); this.reset();">
                <div class="form-group">
                    <div>
                        <label for="message">Message </label>
                        <textarea class="form-control" id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Send Feedback</button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
